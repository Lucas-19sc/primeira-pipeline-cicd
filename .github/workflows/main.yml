name: CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # CI - BUILD E ENVIO DA IMAGEM PARA O DOCKER
  # ==========================================
  CI:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:

      # Baixa o código do repositório
      - name: Obtendo o código
        uses: actions/checkout@v4

      # Autentica no Docker Hub
      - name: Autenticação no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Cria e envia a imagem para o Docker Hub
      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            lucascardoso1/aula-primeira-pipeline:v${{ github.run_number }}
            lucascardoso1/aula-primeira-pipeline:latest

  # ==========================================
  # CD - DEPLOY DA IMAGEM NO CLUSTER EKS
  # ==========================================
  CD:
    needs: [CI]
    uses: Lucas-19sc/primeira-pipeline-cicd/.github/workflows/deploy.yaml@main
    with:
      manifests: k8s/deployment.yaml
      images: lucascardoso1/aula-primeira-pipeline:v${{ github.run_number }}
    secrets: inherit