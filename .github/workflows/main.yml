name: CI-CD

on:
  push:


  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # CI - BUILD E ENVIO DA IMAGEM PARA O DOCKER
  # ==========================================
  CI:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      # Baixa o código do repositório
      - name: Obtendo o código
        uses: actions/checkout@v4

      # Autentica no Docker Hub
      - name: Autenticação no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Cria e envia a imagem para o Docker Hub
      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            lucascardoso1/aula-primeira-pipeline:v${{ github.run_number }}
            lucascardoso1/aula-primeira-pipeline:latest

  # ==========================================
  # CD - DEPLOY DA IMAGEM NO CLUSTER EKS
  # ==========================================
  CD-Homolog:
    name: Deploy em Homologação
    needs: [CI]
    runs-on: ubuntu-latest
    steps:
      - name: Obtendo o código
        uses: actions/checkout@v4.1.5

      - name: Configuração de contexto do Kubernetes
        uses: azure/k8s-set-context@v4.0.0
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K8S_CONFIG }}

      - name: Execução do Manifesto
        uses: Azure/k8s-deploy@v5
        with:
          manifests: |
            ./k8s/deployment.yaml
          images: |
            lucascardoso1/aula-primeira-pipeline:v${{ github.run_number }}
          environment: homologacao
          secrets: inherit

  CD-Producao:
    name: Deploy em Produção
    needs: [CI]
    runs-on: ubuntu-latest
    steps:
      - name: Obtendo o código
        uses: actions/checkout@v4.1.5

      - name: Configuração de contexto do Kubernetes
        uses: azure/k8s-set-context@v4.0.0
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K8S_CONFIG }}

      - name: Execução do Manifesto
        uses: Azure/k8s-deploy@v5
        with:
          manifests: |
            ./k8s/deployment.yaml
          images: |
            lucascardoso1/aula-primeira-pipeline:v${{ github.run_number }}
          environment: producao
          secrets: inherit