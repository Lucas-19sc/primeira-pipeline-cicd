name: CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: Obtendo o código
        uses: actions/checkout@v4

      - name: Autenticação no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verificando identidade AWS do GitHub
        run: aws sts get-caller-identity    

      - name: Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: |
            lucascardoso1/aula-primeira-pipeline:v${{ github.run_number }}
            lucascardoso1/aula-primeira-pipeline:latest

  CD:
    runs-on: ubuntu-latest
    needs: CI

    steps:
      - name: Obtendo o código
        uses: actions/checkout@v4

      - name: Configurando credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Validando identidade AWS
        run: aws sts get-caller-identity

      - name: Configurando acesso ao cluster EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name eks-lab

      - name: Testando acesso ao Kubernetes
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Executando o manifesto Kubernetes
        uses: Azure/k8s-deploy@v5
        with:
          manifests: |
            ./k8s/deployment.yaml
          images: |
            lucascardoso1/aula-primeira-pipeline:v${{ github.run_number }}